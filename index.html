<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChartAnalyze</title>
    <script>
        (function() {
            var language = (navigator.language || navigator.userLanguage || 'ko').toLowerCase();
            var target = language.indexOf('ja') === 0 ? 'ja' : language.indexOf('en') === 0 ? 'en' : 'ko';
            window.location.replace('/' + target + '/');
        })();
    </script>
</head>
<body>
    <nav aria-label="Language selection">
        <a href="/en/">English</a>
        <a href="/ko/">한국어</a>
        <a href="/ja/">日本語</a>
    </nav>
</body>
</html>
